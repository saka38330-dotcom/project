<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Memproses Login...</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .loader-box {
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 3rem;
            border-radius: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="spinner"></div>
        <h2>🔄 Mengalihkan ke Server...</h2>
        <p>Mohon tunggu, sedang memproses login Anda</p>
    </div>

    <div class="loader-box">
        <h2>⚠️ Halaman Tidak Digunakan</h2>
        <p>Halaman ini sudah tidak digunakan. Silakan kembali ke <a href="index.html" style="color: #60a5fa; text-decoration: underline;">halaman login</a>.</p>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1800);
    </script>
</body>
</html>
