<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Portal Beasiswa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 flex min-h-screen">

    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col p-4 fixed h-full">
        <h2 class="text-xl font-bold text-white mb-6">💼 Master Admin</h2>
        <nav class="flex-1 space-y-1">
            <button onclick="showSection('ringkasan')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800">📊 Ringkasan</button>
            <button onclick="showSection('pendaftar')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800">👥 Pendaftar</button>
            <button onclick="showSection('beasiswa')" class="w-full text-left px-4 py-2 rounded hover:bg-slate-800">📜 Beasiswa</button>
        </nav>
        <a onclick="doLogout()" class="bg-red-600 text-white text-center py-2 rounded mt-4 cursor-pointer">Logout</a>
    </aside>

    <main class="flex-1 p-8 ml-64">
        <section id="sec-ringkasan">
            <h1 class="text-2xl font-bold mb-6">Ringkasan</h1>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded shadow">
                    <p class="text-sm text-slate-400">Total Pendaftar</p>
                    <p id="stat-pendaftar" class="text-3xl font-bold">0</p>
                </div>
            </div>
        </section>

        <section id="sec-pendaftar" class="hidden">
            <div class="flex justify-between mb-4">
                <h1 class="text-2xl font-bold">Data Pendaftar</h1>
                <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded">+ Tambah</button>
            </div>
            <div class="bg-white rounded shadow">
                <table class="w-full">
                    <thead class="bg-slate-100">
                        <tr>
                            <th class="p-3 text-left">Nama</th>
                            <th class="p-3 text-left">NIM</th>
                            <th class="p-3 text-left">Jurusan</th>
                            <th class="p-3">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-pendaftar"></tbody>
                </table>
            </div>
        </section>

        <section id="sec-beasiswa" class="hidden">
            <h1 class="text-2xl font-bold mb-4">Beasiswa</h1>
            <p class="text-slate-600">Fitur beasiswa (belum diimplementasi)</p>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-96">
            <h3 class="text-lg font-bold mb-4">Tambah Pendaftar</h3>
            <form onsubmit="saveData(event)">
                <input type="text" id="nama" placeholder="Nama" class="w-full p-2 border rounded mb-2" required>
                <input type="text" id="nim" placeholder="NIM" class="w-full p-2 border rounded mb-2" required>
                <input type="text" id="jurusan" placeholder="Jurusan" class="w-full p-2 border rounded mb-4" required>
                <div class="flex gap-2 justify-end">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-300 rounded">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // KEY YANG SAMA UNTUK ADMIN DAN VERIFIKATOR
        const DB_KEY = 'portal_beasiswa_pendaftar';
        
        let data = JSON.parse(localStorage.getItem(DB_KEY)) || [
            { id: 1, nama: 'Budi Santoso', nim: '22010101', jurusan: 'Teknik Informatika' },
            { id: 2, nama: 'Siti Rahma', nim: '22010102', jurusan: 'Sistem Informasi' }
        ];

        window.onload = () => renderTable();

        function renderTable() {
            const tbody = document.getElementById('table-pendaftar');
            const stat = document.getElementById('stat-pendaftar');
            
            tbody.innerHTML = data.map(p => `
                <tr class="border-b">
                    <td class="p-3">${p.nama}</td>
                    <td class="p-3">${p.nim}</td>
                    <td class="p-3">${p.jurusan}</td>
                    <td class="p-3 text-center">
                        <button onclick="hapus(${p.id})" class="text-red-500">Hapus</button>
                    </td>
                </tr>
            `).join('');
            
            if (stat) stat.textContent = data.length;
            
            // SYNC OTOMATIS KE VERIFIKATOR
            syncToVerifikator();
        }

        function syncToVerifikator() {
            // Buat dokumen untuk verifikator
            const dokumenUntukVerifikator = data.map(p => ({
                id: p.id,
                namaMhs: p.nama,
                nim: p.nim,
                jenis: 'Dokumen_Pendaftaran.pdf',
                tanggal: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
                status: 'Belum Diperiksa'
            }));
            
            localStorage.setItem('portal_beasiswa_dokumen', JSON.stringify(dokumenUntukVerifikator));
            console.log('✅ Data disinkronisasi ke verifikator:', dokumenUntukVerifikator.length, 'dokumen');
        }

        function saveData(e) {
            e.preventDefault();
            
            const newData = {
                id: Date.now(),
                nama: document.getElementById('nama').value,
                nim: document.getElementById('nim').value,
                jurusan: document.getElementById('jurusan').value
            };
            
            data.push(newData);
            localStorage.setItem(DB_KEY, JSON.stringify(data));
            
            closeModal();
            renderTable();
            alert('✅ Data tersimpan!');
        }

        function hapus(id) {
            if (confirm('Hapus?')) {
                data = data.filter(p => p.id !== id);
                localStorage.setItem(DB_KEY, JSON.stringify(data));
                renderTable();
            }
        }

        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function showSection(section) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('sec-' + section).classList.remove('hidden');
        }
    </script>
    <script>
        (function() {
            const loggedRole = sessionStorage.getItem('loggedRole');
            if (!loggedRole || loggedRole !== 'admin') {
                window.location.href = 'index.html';
            }
        })();

        function doLogout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
