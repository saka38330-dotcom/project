<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; color:#e2e8f0; font-family:Inter, sans-serif; }
        .card { padding:2rem; border-radius:24px; background:rgba(15,23,42,0.95); border:1px solid rgba(255,255,255,0.08); max-width:520px; width:100%; text-align:center; }
        a { color:#60a5fa; text-decoration:underline; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #60a5fa; border-radius: 50%; animation: spin 1s linear infinite; margin: 1.5rem auto 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Logout Berhasil</h1>
        <p>Anda telah keluar dari sesi. Mengalihkan kembali ke login.</p>
        <div class="spinner"></div>
    </div>
    <script>
        sessionStorage.removeItem('loggedUsername');
        sessionStorage.removeItem('loggedRole');
        setTimeout(() => window.location.href = 'index.html', 900);
    </script>
</body>
</html>
