<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Portal Beasiswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); color: white; min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
        .card { background: rgba(255,255,255,0.06); padding:24px; border-radius:16px; width:100%; max-width:480px; border:1px solid rgba(255,255,255,0.08); }
        input, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03); color:white; margin-top:6px; }
        label { font-size:12px; color:#cbd5e1; display:block; margin-top:12px; }
        button { margin-top:16px; width:100%; padding:12px; border-radius:12px; border:none; background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:white; font-weight:700; cursor:pointer; }
        .link { margin-top:12px; text-align:center; font-size:13px; }
        a { color:#60a5fa; text-decoration:underline; }
        .toast { position:fixed; bottom:20px; right:20px; background:#111827; color:white; padding:10px 14px; border-radius:10px; opacity:0; transition:opacity .3s; }
        .toast.show { opacity:1; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin:0 0 6px 0;">Daftar Akun Baru</h2>
        <p style="margin:0 0 12px 0; color:#94a3b8; font-size:13px;">Buat akun untuk mengakses portal. Akun disimpan secara lokal untuk demo.</p>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <label>Username / NIM</label>
            <input type="text" id="regUsername" required placeholder="Masukkan username atau NIM">

            <label>Password</label>
            <input type="password" id="regPassword" required placeholder="Masukkan password">

            <label>Peran</label>
            <select id="regRole">
                <option value="mahasiswa">Mahasiswa</option>
                <option value="verifikator">Verifikator</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit">Daftar Sekarang</button>
        </form>

n        <div class="link">Sudah punya akun? <a href="index.html">Masuk</a></div>
    </div>

    <div id="toast" class="toast">Pesan</div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

            async function handleRegister(e) {
                e.preventDefault();
                const username = document.getElementById('regUsername').value.trim();
                const password = document.getElementById('regPassword').value.trim();
                const role = document.getElementById('regRole').value;

                if (!username || !password) {
                    showToast('Username dan password harus diisi');
                    return;
                }

                const form = new FormData();
                form.append('username', username);
                form.append('password', password);
                form.append('role', role);

                try {
                    const res = await fetch('register_process.php', {
                        method: 'POST',
                        body: form
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast('✅ Registrasi berhasil — dialihkan ke login');
                        setTimeout(() => { window.location.href = 'index.html?registered=1'; }, 1000);
                    } else {
                        showToast(data.message || 'Gagal registrasi');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Terjadi kesalahan saat menghubungi server');
                }
            }
    </script>
</body>
</html>
