<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Beasiswa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Portal Beasiswa</h1>
            <p class="text-xs text-slate-400 mt-1">Masuk menggunakan akun simulasi (Tanpa Database Server)</p>
        </div>

        <div id="error-box" class="hidden bg-red-50 text-red-600 text-xs p-3 rounded-lg mb-4 font-medium border border-red-200">
            ❌ Username, Password, atau Peran yang Anda pilih salah!
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Username / NIM</label>
                <input type="text" id="username" required placeholder="Masukkan username" 
                    class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-wider">Masuk Sebagai</label>
                <select id="role" required class="w-full p-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-blue-500 cursor-pointer">
                    <option value="mahasiswa">Mahasiswa (Pendaftar)</option>
                    <option value="verifikator">Verifikator (Tim Seleksi)</option>
                    <option value="admin">Master Admin</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-xl text-sm transition shadow-md cursor-pointer mt-2">
                Masuk Sistem
            </button>
        </form>

        <div class="mt-6 p-4 bg-slate-50 rounded-xl border border-slate-200 text-[11px] text-slate-500 space-y-1.5">
            <p class="font-bold text-slate-700">💡 Akun Simulasi Login:</p>
            <div class="space-y-1 font-mono text-slate-600">
                <p>• <strong>Mahasiswa:</strong> 22010101 / 22010101</p>
                <p>• <strong>Verifikator:</strong> verifikator123 / verifikator123</p>
                <p>• <strong>Admin:</strong> admin / admin123</p>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // Mencegah refresh halaman saat submit

            const usernameInp = document.getElementById('username').value;
            const passwordInp = document.getElementById('password').value;
            const roleInp = document.getElementById('role').value;
            const errorBox = document.getElementById('error-box');

            // Menyembunyikan error box setiap kali tombol submit ditekan ulang
            errorBox.classList.add('hidden');

            // Logika Validasi Login (Sudah Diperbaiki)
            if (roleInp === 'mahasiswa' && usernameInp === '22010101' && passwordInp === '22010101') {
                window.location.href = "dashboard-mahasiswa.html";
            } else if (roleInp === 'verifikator' && usernameInp === 'verifikator123' && passwordInp === 'verifikator123') { // <-- Diperbaiki di sini
                window.location.href = "dashboard-verifikator.html";
            } else if (roleInp === 'admin' && usernameInp === 'admin' && passwordInp === 'admin123') {
                window.location.href = "dashboard-admin.html";
            } else {
                // Tampilkan pesan error jika data tidak cocok
                errorBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
