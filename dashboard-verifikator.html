<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Verifikator Berkas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50">

    <nav class="bg-amber-700 text-white p-4 flex items-center justify-between">
        <h1 class="text-lg font-bold">🔍 Panel Verifikator Berkas</h1>
        <button onclick="doLogout()" class="text-sm underline">Logout</button>
    </nav>

    <div class="max-w-6xl mx-auto p-6">
        
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow">
                <p class="text-xs text-slate-400">Total Antrean</p>
                <p id="count-total" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <p class="text-xs text-slate-400">Belum Diperiksa</p>
                <p id="count-pending" class="text-2xl font-bold text-amber-600">0</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <p class="text-xs text-slate-400">Selesai</p>
                <p id="count-done" class="text-2xl font-bold text-green-600">0</p>
            </div>
        </div>

        <div class="bg-white rounded shadow">
            <table class="w-full">
                <thead class="bg-slate-100">
                    <tr>
                        <th class="p-3 text-left">Nama</th>
                        <th class="p-3 text-left">Dokumen</th>
                        <th class="p-3 text-left">Tanggal</th>
                        <th class="p-3">Status</th>
                        <th class="p-3 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-verifikator"></tbody>
            </table>
            <div id="empty" class="hidden p-8 text-center text-slate-400">
                Tidak ada dokumen
            </div>
        </div>

        <div class="mt-4 p-4 bg-blue-50 rounded">
            <button onclick="forceSync()" class="bg-blue-600 text-white px-4 py-2 rounded">🔄 Sinkronisasi Manual</button>
            <p class="text-xs text-slate-600 mt-2">Auto-refresh setiap 3 detik</p>
        </div>
    </div>

    <script>
        // KEY YANG SAMA DENGAN ADMIN
        const DB_KEY_VERIFIKATOR = 'portal_beasiswa_dokumen';
        
        let dokumenList = [];

        function validateSession() {
            const loggedRole = sessionStorage.getItem('loggedRole');
            if (!loggedRole || loggedRole !== 'verifikator') {
                window.location.href = 'index.html';
            }
        }

        function doLogout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // Load data saat halaman dibuka
        window.addEventListener('load', () => {
            validateSession();
            console.log('🔍 Dashboard Verifikator loaded');
            loadData();
            renderTable();
            
            // Auto-refresh setiap 3 detik
            setInterval(() => {
                loadData();
                renderTable();
            }, 3000);
        });

        // Listen perubahan dari tab lain
        window.addEventListener('storage', (e) => {
            if (e.key === DB_KEY_VERIFIKATOR) {
                console.log('🔄 Data berubah dari tab lain');
                loadData();
                renderTable();
            }
        });

        function loadData() {
            dokumenList = JSON.parse(localStorage.getItem(DB_KEY_VERIFIKATOR)) || [];
            console.log('✅ Loaded', dokumenList.length, 'dokumen');
        }

        function forceSync() {
            loadData();
            renderTable();
            alert('✅ Sinkronisasi berhasil! Data: ' + dokumenList.length);
        }

        function renderTable() {
            const tbody = document.getElementById('table-verifikator');
            const empty = document.getElementById('empty');
            
            if (dokumenList.length === 0) {
                empty.classList.remove('hidden');
                tbody.innerHTML = '';
                updateStats();
                return;
            }
            
            empty.classList.add('hidden');
            
            tbody.innerHTML = dokumenList.map(doc => {
                let statusBadge = '';
                let buttons = '';
                
                if (doc.status === 'Belum Diperiksa') {
                    statusBadge = '<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs">⏳ Belum Diperiksa</span>';
                    buttons = `
                        <button onclick="updateStatus(${doc.id}, 'Disetujui')" class="bg-green-500 text-white px-3 py-1 rounded text-xs mr-1">Setujui</button>
                        <button onclick="updateStatus(${doc.id}, 'Ditolak')" class="bg-red-500 text-white px-3 py-1 rounded text-xs">Tolak</button>
                    `;
                } else if (doc.status === 'Disetujui') {
                    statusBadge = '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">✅ Disetujui</span>';
                    buttons = '<span class="text-slate-400 text-xs">Sudah diproses</span>';
                } else {
                    statusBadge = '<span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs">❌ Ditolak</span>';
                    buttons = '<span class="text-slate-400 text-xs">Sudah diproses</span>';
                }
                
                return `
                    <tr class="border-b">
                        <td class="p-3">
                            <div class="font-semibold">${doc.namaMhs}</div>
                            <div class="text-xs text-slate-400">NIM: ${doc.nim}</div>
                        </td>
                        <td class="p-3 text-amber-700">📄 ${doc.jenis}</td>
                        <td class="p-3 text-sm text-slate-600">${doc.tanggal}</td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3 text-center">${buttons}</td>
                    </tr>
                `;
            }).join('');
            
            updateStats();
        }

        function updateStatus(id, newStatus) {
            const doc = dokumenList.find(d => d.id === id);
            if (doc) {
                doc.status = newStatus;
                localStorage.setItem(DB_KEY_VERIFIKATOR, JSON.stringify(dokumenList));
                renderTable();
                alert('✅ Status diubah menjadi: ' + newStatus);
            }
        }

        function updateStats() {
            document.getElementById('count-total').textContent = dokumenList.length;
            document.getElementById('count-pending').textContent = dokumenList.filter(d => d.status === 'Belum Diperiksa').length;
            document.getElementById('count-done').textContent = dokumenList.filter(d => d.status !== 'Belum Diperiksa').length;
        }
    </script>
</body>
</html>
